name: Test optional inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          fail-on-deny: "false"
          contact-url: "https://example.com/contact"
          db-cache-key: "fossier-db-optional-test"
          registry-url: "https://registry.fossier.io"

      - name: Assert action accepted optional inputs and ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
          OUTCOME_VAL: ${{ steps.action.outputs.outcome }}
          DETAILS: ${{ steps.action.outputs.details }}
        run: |
          echo "step outcome: $OUTCOME"
          echo "outcome output: $OUTCOME_VAL"
          echo "details: $DETAILS"
          if [ "$OUTCOME" = "success" ]; then
            # Under workflow_dispatch the event is not a pull_request, so the
            # action exits 0 without setting outputs. Both cases are valid:
            # - outputs set: action evaluated a PR successfully
            # - outputs empty: action ran but skipped evaluation (non-PR event)
            echo "PASS: action accepted optional inputs and completed successfully (outcome='$OUTCOME_VAL')"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (setup/install issue or sentinel repo)"
          else
            echo "FAIL: unexpected step outcome '$OUTCOME'"
            exit 1
          fi
