name: Test fail-on-deny false
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          fail-on-deny: "false"
          db-cache-key: "fossier-db-test"

      - name: Assert step did not fail due to deny (fail-on-deny is false)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "step outcome: $OUTCOME"
          # With fail-on-deny=false, the action's evaluate step always exits 0
          # regardless of the fossier decision. Under workflow_dispatch the event
          # is not a pull_request, so the action exits 0 without setting outputs.
          # The step may still fail if setup/install fails, but it must NOT fail
          # because of a DENY decision.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed without propagating a deny failure"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (setup/install issue or sentinel repo)"
          else
            echo "FAIL: unexpected step outcome '$OUTCOME'"
            exit 1
          fi
