name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          fail-on-deny: "false"

      # Under workflow_dispatch there is no PR event, so fossier.action exits
      # with code 3 (no GITHUB_EVENT_PATH / no PR data). The composite action
      # shell wrapper only propagates failure when exit_code=1 AND
      # FOSSIER_FAIL_ON_DENY=true, so the overall step must succeed (exit 0).
      - name: Assert action completed without error
        run: |
          echo "Action step completed successfully (exit 0)"
          echo "PASS"
