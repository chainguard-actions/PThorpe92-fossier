name: Test basic usage (no PR event)
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          fail-on-deny: "false"

      - name: Assert action completed without error
        run: |
          echo "Action completed successfully (no PR event — expected exit 0)"
          echo "PASS"
