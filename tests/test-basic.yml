name: Test basic usage - action completes without failing
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fake PR event payload
        run: |
          mkdir -p /tmp/fossier-test
          cat > /tmp/fossier-test/event.json <<'EOF'
          {
            "pull_request": {
              "number": 42,
              "user": {
                "login": "test-contributor"
              },
              "labels": []
            }
          }
          EOF
          echo "GITHUB_EVENT_PATH=/tmp/fossier-test/event.json" >> $GITHUB_ENV

      - id: action
        uses: .
        with:
          github-token: fake-token-for-testing
          fail-on-deny: "false"
          db-cache-key: "test-fossier-db"

      - name: Assert action step completed
        run: |
          echo "Action step completed successfully (fail-on-deny=false)"
          echo "PASS"
