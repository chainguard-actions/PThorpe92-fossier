name: Test fail-on-deny true behavior
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/1/merge
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          fail-on-deny: "true"
        continue-on-error: true

      - name: Assert action ran (outcome is success or failure, not skipped/cancelled)
        run: |
          echo "Action step outcome: ${{ steps.action.outcome }}"
          # The action should either succeed or fail, but not be skipped or cancelled
          outcome="${{ steps.action.outcome }}"
          if [ "$outcome" = "skipped" ] || [ "$outcome" = "cancelled" ]; then
            echo "FAIL: unexpected outcome '$outcome'"
            exit 1
          fi
          echo "PASS: action ran with outcome '$outcome' (expected success or failure)"
