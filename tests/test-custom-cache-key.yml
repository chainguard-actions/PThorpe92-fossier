name: Test custom db-cache-key input
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          db-cache-key: "my-custom-fossier-db"
          fail-on-deny: "false"

      - name: Assert action completed with custom cache key
        run: |
          echo "Action completed with custom db-cache-key without error"
          echo "PASS"
