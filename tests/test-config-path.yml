name: Test config-path input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fossier config file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/hardened/tests/fixtures/fossier-config"
          cat > "$GITHUB_WORKSPACE/hardened/tests/fixtures/fossier-config/fossier.toml" <<'EOF'
          [thresholds]
          deny = 80
          review = 50
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          config-path: ${{ github.workspace }}/hardened/tests/fixtures/fossier-config/fossier.toml
          fail-on-deny: "false"

      - name: Assert action ran with config-path input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with config-path input"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
