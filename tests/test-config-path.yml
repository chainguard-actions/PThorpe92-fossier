name: Test config-path input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/1/merge
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a fossier config file
        run: |
          cat > /tmp/fossier.toml <<'EOF'
          [thresholds]
          deny = 80
          review = 50
          EOF

      - name: Run action with config-path input
        id: action
        continue-on-error: true
        uses: .
        with:
          github-token: ${{ github.token }}
          config-path: /tmp/fossier.toml
          fail-on-deny: "false"

      - name: Assert action ran (config-path accepted)
        run: |
          echo "Action completed (config-path input was accepted)"
          echo "PASS"
