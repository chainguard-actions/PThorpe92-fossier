name: Test config-path input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fossier config file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/hardened/tests/fixtures/fossier-config"
          cat > "$GITHUB_WORKSPACE/hardened/tests/fixtures/fossier-config/fossier.toml" <<'EOF'
          [scoring]
          account_age_days_threshold = 30
          follower_threshold = 1
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          config-path: ${{ github.workspace }}/hardened/tests/fixtures/fossier-config/fossier.toml
          fail-on-deny: "false"

      - name: Assert action ran with config-path input
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RESULT_OUTCOME: ${{ steps.action.outputs.outcome }}
        run: |
          echo "step outcome: $OUTCOME"
          echo "action outcome output: $RESULT_OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$RESULT_OUTCOME" ]; then
              echo "FAIL: action succeeded but outcome output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with outcome='$RESULT_OUTCOME'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable or no PR context)"
          else
            echo "FAIL: unexpected step outcome '$OUTCOME'"
            exit 1
          fi
