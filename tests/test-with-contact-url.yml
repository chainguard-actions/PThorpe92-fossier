name: Test with contact-url and custom cache key
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/1/merge
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          fail-on-deny: "false"
          contact-url: "https://example.com/contact"
          db-cache-key: "fossier-db-custom"
        continue-on-error: true

      - name: Assert action accepted optional inputs
        run: |
          # The action should accept optional inputs without crashing at the
          # input-parsing stage. The FOSSIER_CONTACT_URL env var should be set.
          echo "PASS: action accepted contact-url and custom db-cache-key"
